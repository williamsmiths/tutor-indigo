<!-- Research Section -->
<div id="research-section">
  <div class="research-container">
    <div class="section-hd">
      <h2 class="section-title">Khoa Học Công Nghệ</h2>
      <p class="section-subtitle">Khám phá những hoạt động nghiên cứu khoa học tiêu biểu</p>
    </div>

    <!-- Research image cards -->
    <div class="research-cards">
      <div class="research-card">
        <div class="research-img">
          <img src="/static/indigo/images/hero/about_2.png" alt="Hoạt Động Khoa Học" />
          <div class="research-card-overlay">
            <h3>Hoạt Động Khoa Học</h3>
          </div>
        </div>
      </div>

      <div class="research-card research-card--lg">
        <div class="research-img">
          <img src="/static/indigo/images/hero/students.png" alt="Công Bố Quốc Tế" />
          <div class="research-card-overlay">
            <h3>Công Bố Quốc Tế</h3>
          </div>
        </div>
      </div>

      <div class="research-card">
        <div class="research-img">
          <img src="/static/indigo/images/hero/about_1.png" alt="Đề Tài Nghiên Cứu Của Khoa (NCKH)" />
          <div class="research-card-overlay">
            <h3>Đề Tài Nghiên Cứu Của Khoa (NCKH)</h3>
          </div>
        </div>
      </div>
    </div>

    <!-- Stats bar -->
    <div class="research-stats">
      <div class="stat-item">
        <span class="stat-number">25K+</span>
        <span class="stat-label">Sinh Viên</span>
      </div>

      <div class="stat-divider"></div>

      <div class="stat-item">
        <span class="stat-number">1250</span>
        <span class="stat-label">Bài Công Bố Quốc Tế</span>
      </div>

      <div class="stat-divider"></div>

      <div class="stat-item">
        <span class="stat-number">1150</span>
        <span class="stat-label">Đề Tài NCKH</span>
      </div>

      <div class="stat-divider"></div>

      <div class="stat-item">
        <span class="stat-number">Top 30</span>
        <span class="stat-label">Công Bố Quốc Tế Tại VN</span>
      </div>
    </div>
  </div>
</div>
